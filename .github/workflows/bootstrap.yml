name: Bootstrap BuildDeck source + debug APK

on:
  push:
    branches: [main]
    paths:
      - builddeck-source.tar.xz.b64
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unpack BuildDeck Batch 2 source
        run: |
          test -s builddeck-source.tar.xz.b64
          base64 --decode builddeck-source.tar.xz.b64 | tar -xJf - --strip-components=1
          test -f app/build.gradle.kts
          rm builddeck-source.tar.xz.b64
          rm .github/workflows/bootstrap.yml
      - name: Publish readable source files to repository
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import BuildDeck Batch 2 AI Control source"
            git push origin HEAD:main
          fi
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: builddeck-batch2-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
