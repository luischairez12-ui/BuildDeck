name: Import BuildDeck Batch 2 and compile APK

on:
  push:
    branches: [main]
    paths:
      - BuildDeck_Batch2_AI_Control_Source.zip
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Expand Batch 2 source archive
        run: |
          test -s BuildDeck_Batch2_AI_Control_Source.zip
          mkdir -p "$RUNNER_TEMP/builddeck"
          unzip -q BuildDeck_Batch2_AI_Control_Source.zip -d "$RUNNER_TEMP/builddeck"
          test -f "$RUNNER_TEMP/builddeck/BuildDeck/app/build.gradle.kts"
          cp -a "$RUNNER_TEMP/builddeck/BuildDeck/." .
          rm BuildDeck_Batch2_AI_Control_Source.zip
          rm .github/workflows/bootstrap.yml
      - name: Publish extracted source files to GitHub
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import BuildDeck Batch 2 AI Control source"
            git push origin HEAD:main
          fi
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile BuildDeck debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Upload installable APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: builddeck-batch2-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
